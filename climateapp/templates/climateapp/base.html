{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Climate Monitor</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{% static 'climateapp/style.css' %}">

</head>


<body>


    <!-- Navigation Bar -->

    <nav class="navbar navbar-dark bg-dark px-4">

        <div class="container-fluid">

            <a
                class="navbar-brand"
                href="{% url 'home' %}">

                🌍 Climate Monitor

            </a>


            <div class="d-flex">

                <a
                    class="nav-link text-white me-3"
                    href="{% url 'home' %}">

                    Home

                </a>


                <a
                    class="nav-link text-white me-3"
                    href="{% url 'about' %}">

                    About

                </a>


                <a
                    class="nav-link text-white me-3"
                    href="{% url 'climate_data' %}">

                    Climate Data

                </a>


                <a
                    class="nav-link text-white"
                    href="{% url 'add_climate' %}">

                    Add Data

                </a>

            </div>

        </div>

    </nav>



    <!-- Main Content -->

    <main>

        {% block content %}

        {% endblock %}

    </main>



    <!-- Footer -->

    <footer class="bg-dark text-white text-center p-3 mt-5">

        <p class="mb-0">

            © 2026 Climate Monitor

        </p>

    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script
        src="{% static 'climateapp/script.js' %}">
    </script>


</body>

</html>
